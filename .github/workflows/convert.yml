name: Auto Convert Video to HLS

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video Link (.mp4 / .mkv)'
        required: true
      folder_path:
        description: 'Folder path (e.g., test/ep1)'
        required: true

jobs:
  convert_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Download & Convert to HLS Chunks
        run: |
          mkdir -p "${{ github.event.inputs.folder_path }}"
          cd "${{ github.event.inputs.folder_path }}"
          
          curl -L "${{ github.event.inputs.video_url }}" -o input_video.mp4
          
          ffmpeg -i input_video.mp4 \
            -codec: copy \
            -start_number 0 \
            -hls_time 6 \
            -hls_list_size 0 \
            -hls_segment_filename "chunk_%03d.ts" \
            index.m3u8
            
          rm input_video.mp4

      - name: Save HLS Chunks to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Added HLS stream for ${{ github.event.inputs.folder_path }}" || exit 0
          git push origin main
