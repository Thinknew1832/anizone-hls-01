name: Universal Video to HLS Converter

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video Link (.mp4 / .mkv)'
        required: true
      folder_path:
        description: 'Folder path (e.g., test/ep1)'
        required: true

permissions:
  contents: write

jobs:
  convert_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Download Video
        run: |
          mkdir -p "${{ inputs.folder_path }}"
          cd "${{ inputs.folder_path }}"
          
          echo "Downloading from: ${{ inputs.video_url }}"
          curl -L -f "${{ inputs.video_url }}" -o input.mp4
          
          # ఫైల్ సైజ్ కనీసం 500KB ఉందో లేదో వెరిఫై చేస్తుంది
          FILE_SIZE=$(wc -c < input.mp4)
          echo "Downloaded file size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 500000 ]; then
            echo "ERROR: Downloaded file is too small or an HTML error page. Not a valid video."
            cat input.mp4 | head -n 20
            exit 1
          fi

      - name: Convert to HLS
        run: |
          cd "${{ inputs.folder_path }}"
          ffmpeg -i input.mp4 -codec: copy -start_number 0 -hls_time 6 -hls_list_size 0 -f hls index.m3u8
          rm input.mp4

      - name: Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add HLS for ${{ inputs.folder_path }}" || exit 0
          git push origin main
