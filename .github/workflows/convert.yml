name: Convert R2 Video to HLS

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct R2 Video Link'
        required: true
      folder_path:
        description: 'Target Folder Path (e.g., test/ep2)'
        required: true

permissions:
  contents: write

jobs:
  convert_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Download Video from R2
        run: |
          mkdir -p "${{ inputs.folder_path }}"
          cd "${{ inputs.folder_path }}"
          echo "Downloading from R2..."
          curl -L -f "${{ inputs.video_url }}" -o input.mp4

      - name: Convert to Multi-Audio HLS Chunks
        run: |
          cd "${{ inputs.folder_path }}"
          
          # HLS Multi-Audio conversion
          ffmpeg -i input.mp4 \
            -map 0:v:0 -map 0:a:0 -map 0:a:1? \
            -c:v copy -c:a copy \
            -f hls \
            -hls_time 6 \
            -hls_list_size 0 \
            -master_pl_name master.m3u8 \
            -var_stream_map "v:0,agroup:aud,name:video a:0,agroup:aud,language:hin,name:Hindi a:1,agroup:aud,language:jpn,name:Japanese" \
            stream_%v.m3u8 || \
          ffmpeg -i input.mp4 \
            -c:v copy -c:a copy \
            -f hls \
            -hls_time 6 \
            -hls_list_size 0 \
            master.m3u8

          # మాస్టర్ ప్లేలిస్ట్‌లో వీడియో స్ట్రీమ్ మిస్ అయితే ఫోర్స్ ఇంజెక్ట్ చేయడం
          if ! grep -q "stream_video.m3u8" master.m3u8; then
            echo '#EXT-X-STREAM-INF:BANDWIDTH=2500000,RESOLUTION=1920x1080,AUDIO="aud"' >> master.m3u8
            echo 'stream_video.m3u8' >> master.m3u8
          fi

          rm -f input.mp4

      - name: Push HLS Chunks to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix video mapping in master playlist for ${{ inputs.folder_path }}" || exit 0
          git push origin main
