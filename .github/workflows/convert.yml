name: Auto Convert Video to HLS

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video Link or Google Drive Link'
        required: true
      folder_path:
        description: 'Folder path (e.g., test/ep1)'
        required: true

permissions:
  contents: write

jobs:
  convert_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Video
        run: |
          mkdir -p "${{ inputs.folder_path }}"
          URL="${{ inputs.video_url }}"
          
          if [[ "$URL" == *"drive.google.com"* ]]; then
            yt-dlp "$URL" -o "${{ inputs.folder_path }}/input.mp4"
          else
            curl -L "$URL" -o "${{ inputs.folder_path }}/input.mp4"
          fi

      - name: Convert to HLS
        run: |
          cd "${{ inputs.folder_path }}"
          ffmpeg -i input.mp4 -codec: copy -start_number 0 -hls_time 6 -hls_list_size 0 -f hls index.m3u8
          rm input.mp4

      - name: Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add HLS files for ${{ inputs.folder_path }}" || exit 0
          git push origin main
