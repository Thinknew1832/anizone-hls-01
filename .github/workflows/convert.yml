name: Auto Convert Video to HLS

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video Link (.mp4 / .mkv)'
        required: true
      folder_path:
        description: 'Folder path (e.g., test/ep1)'
        required: true

jobs:
  convert_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Video
        run: |
          mkdir -p "${{ inputs.folder_path }}"
          curl -L "${{ inputs.video_url }}" -o "${{ inputs.folder_path }}/input.mp4"

      - name: Convert to HLS
        run: |
          cd "${{ inputs.folder_path }}"
          ffmpeg -i input.mp4 -codec: copy -start_number 0 -hls_time 6 -hls_list_size 0 -f hls index.m3u8
          rm input.mp4

      - name: Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add HLS files for ${{ inputs.folder_path }}" || exit 0
          git push
