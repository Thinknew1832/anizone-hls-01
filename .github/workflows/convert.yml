name: Convert R2 Video to HLS

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct R2 Video Link'
        required: true
      folder_path:
        description: 'Target Folder Path (e.g., black-torch/ep1)'
        required: true

permissions:
  contents: write

jobs:
  convert_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Download Video from R2
        run: |
          mkdir -p "${{ inputs.folder_path }}"
          cd "${{ inputs.folder_path }}"
          echo "Downloading from R2..."
          curl -L -f "${{ inputs.video_url }}" -o input.mp4

      - name: Convert to HLS Chunks
        run: |
          cd "${{ inputs.folder_path }}"
          ffmpeg -i input.mp4 \
            -map 0:v:0 -map 0:a? -sn \
            -c:v copy -c:a copy \
            -start_number 0 \
            -hls_time 6 \
            -hls_list_size 0 \
            -f hls index.m3u8
          rm input.mp4

      - name: Push HLS Chunks to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add HLS stream for ${{ inputs.folder_path }}" || exit 0
          git push origin main
