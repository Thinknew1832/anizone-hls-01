name: Universal Multi-Audio HLS Generator

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video URL (Cloudflare R2 Public URL)'
        required: true
      folder_path:
        description: 'Target Path (e.g., anime/black-torch/ep1)'
        required: true

permissions:
  contents: write

jobs:
  generate_hls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FFmpeg and JQ
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Utilities
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl

      - name: Download Video from Cloudflare R2
        run: |
          mkdir -p "${{ inputs.folder_path }}"
          cd "${{ inputs.folder_path }}"
          echo "Downloading video from R2..."
          curl -L -f "${{ inputs.video_url }}" -o source_input.mp4
          
          # ఫైల్ సైజ్ చెక్
          if [ ! -s source_input.mp4 ]; then
            echo "Failed to download video file or empty file received."
            exit 1
          fi

      - name: Process Video and Auto-Detect Multi-Audio
        run: |
          cd "${{ inputs.folder_path }}"
          
          echo "Probing video for metadata and audio streams..."
          AUDIO_INFO=$(ffprobe -v error -select_streams a -show_entries stream=index:stream_tags=language,title -of json source_input.mp4)
          AUDIO_COUNT=$(echo "$AUDIO_INFO" | jq '.streams | length')
          
          echo "Found $AUDIO_COUNT audio tracks."

          # 1. వీడియో స్ట్రీమ్‌ను మాత్రమే విడదీసి HLS గా మార్చడం (No Audio in this track)
          ffmpeg -i source_input.mp4 -an -c:v copy \
            -hls_time 6 -hls_list_size 0 -hls_segment_filename "video_%03d.ts" \
            stream_video.m3u8

          # 2. మాస్టర్ ప్లేలిస్ట్ హెడర్ క్రియేషన్
          echo "#EXTM3U" > master.m3u8
          echo "#EXT-X-VERSION:3" >> master.m3u8

          # 3. ప్రతి ఆడియో ట్రాక్‌ను స్కాన్ చేసి HLS గా మార్చడం
          if [ "$AUDIO_COUNT" -eq 0 ]; then
            echo "No audio streams detected. Creating video-only master playlist."
            echo "#EXT-X-STREAM-INF:BANDWIDTH=2500000,RESOLUTION=1920x1080" >> master.m3u8
            echo "stream_video.m3u8" >> master.m3u8
          else
            for (( i=0; i<$AUDIO_COUNT; i++ )); do
              LANG=$(echo "$AUDIO_INFO" | jq -r ".streams[$i].tags.language // empty")
              TITLE=$(echo "$AUDIO_INFO" | jq -r ".streams[$i].tags.title // empty")
              
              # భాష ట్యాగ్ లేకపోతే టైటిల్ లేదా ఇండెక్స్ వాడటం
              if [ -z "$LANG" ] || [ "$LANG" = "null" ]; then
                if [ -n "$TITLE" ] && [ "$TITLE" != "null" ]; then
                  TRACK_NAME="$TITLE"
                  LANG_CODE="und"
                else
                  TRACK_NAME="Audio_$((i+1))"
                  LANG_CODE="und"
                fi
              else
                TRACK_NAME="${LANG^}"
                LANG_CODE="$LANG"
              fi

              # మొదటి ఆడియో ట్రాక్‌ని డిఫాల్ట్‌గా ఉంచడం
              if [ $i -eq 0 ]; then
                DEFAULT_ATTR="YES"
              else
                DEFAULT_ATTR="NO"
              fi

              AUDIO_FILENAME="audio_${i}.m3u8"
              
              echo "Extracting Audio Track $i: $TRACK_NAME ($LANG_CODE)..."
              ffmpeg -i source_input.mp4 -map 0:a:$i -c:a aac -b:a 128k -vn \
                -hls_time 6 -hls_list_size 0 -hls_segment_filename "audio_${i}_%03d.ts" \
                "$AUDIO_FILENAME"

              # master.m3u8 లో ఆడియో ట్రాక్ ఎంట్రీ
              echo "#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID=\"audio_group\",NAME=\"$TRACK_NAME\",DEFAULT=$DEFAULT_ATTR,AUTOSELECT=YES,LANGUAGE=\"$LANG_CODE\",URI=\"$AUDIO_FILENAME\"" >> master.m3u8
            done

            # మాస్టర్ ప్లేలిస్ట్‌లో వీడియో మరియు ఆడియో గ్రూప్‌ను లింక్ చేయడం
            echo "#EXT-X-STREAM-INF:BANDWIDTH=2500000,RESOLUTION=1920x1080,AUDIO=\"audio_group\"" >> master.m3u8
            echo "stream_video.m3u8" >> master.m3u8
          fi

          # ఒరిజినల్ పెద్ద ఫైల్‌ను తొలగించి స్థలాన్ని ఆదా చేయడం
          rm source_input.mp4

      - name: Push HLS Stream to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto HLS generation with multi-audio for ${{ inputs.folder_path }}" || exit 0
          git push origin main
          
