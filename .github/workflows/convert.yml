name: Universal Video to HLS Converter

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Any Video Link (Direct MP4, TeraBox, Drive, etc.)'
        required: true
      folder_path:
        description: 'Folder path (e.g., test/ep1)'
        required: true

permissions:
  contents: write

jobs:
  convert_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Download Tools (yt-dlp & aria2)
        run: |
          sudo apt-get update && sudo apt-get install -y aria2
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Universal Video Download
        run: |
          mkdir -p "${{ inputs.folder_path }}"
          URL="${{ inputs.video_url }}"
          OUTPUT_PATH="${{ inputs.folder_path }}/input.mp4"
          
          # yt-dlp దాదాపు అన్ని ప్లాట్‌ఫారమ్‌లను సపోర్ట్ చేస్తుంది (TeraBox సహా)
          if yt-dlp --external-downloader aria2c --external-downloader-args "-x 16 -s 16 -k 1M" -f "bestvideo+bestaudio/best" "$URL" -o "$OUTPUT_PATH"; then
            echo "Downloaded via yt-dlp successfully"
          else
            echo "yt-dlp failed, falling back to direct curl"
            curl -L "$URL" -o "$OUTPUT_PATH"
          fi

      - name: Convert to HLS
        run: |
          cd "${{ inputs.folder_path }}"
          ffmpeg -i input.mp4 -codec: copy -start_number 0 -hls_time 6 -hls_list_size 0 -f hls index.m3u8
          rm input.mp4

      - name: Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add HLS for ${{ inputs.folder_path }}" || exit 0
          git push origin main
