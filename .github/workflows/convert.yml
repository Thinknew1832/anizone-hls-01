name: R2 Direct Multi-Audio HLS Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video URL (Cloudflare R2 Public URL)'
        required: true
      target_folder:
        description: 'Target Folder in R2 (e.g., black-torch/ep2)'
        required: true

jobs:
  convert_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Utilities
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl

      - name: Download Video from R2
        run: |
          mkdir -p output
          echo "Downloading source video..."
          curl -L -f "${{ inputs.video_url }}" -o source_input.mp4
          if [ ! -s source_input.mp4 ]; then
            echo "Error: Video download failed or file is empty."
            exit 1
          fi

      - name: Convert to Multi-Audio HLS
        run: |
          cd output
          echo "Detecting audio streams..."
          AUDIO_INFO=$(ffprobe -v error -select_streams a -show_entries stream=index:stream_tags=language,title -of json ../source_input.mp4)
          AUDIO_COUNT=$(echo "$AUDIO_INFO" | jq '.streams | length')
          echo "Found $AUDIO_COUNT audio tracks."

          # 1. వీడియో స్ట్రీమ్
          ffmpeg -i ../source_input.mp4 -an -c:v copy \
            -copyts -avoid_negative_ts make_zero \
            -hls_time 6 -hls_list_size 0 \
            -hls_flags independent_segments \
            -hls_segment_filename "video_%03d.ts" \
            stream_video.m3u8

          # 2. మాస్టర్ ప్లేలిస్ట్
          echo "#EXTM3U" > master.m3u8
          echo "#EXT-X-VERSION:3" >> master.m3u8

          # 3. ఆడియో ట్రాక్స్
          if [ "$AUDIO_COUNT" -eq 0 ]; then
            echo "#EXT-X-STREAM-INF:BANDWIDTH=2500000,RESOLUTION=1920x1080" >> master.m3u8
            echo "stream_video.m3u8" >> master.m3u8
          else
            for (( i=0; i<$AUDIO_COUNT; i++ )); do
              LANG=$(echo "$AUDIO_INFO" | jq -r ".streams[$i].tags.language // empty")
              TITLE=$(echo "$AUDIO_INFO" | jq -r ".streams[$i].tags.title // empty")
              
              if [ -z "$LANG" ] || [ "$LANG" = "null" ]; then
                if [ -n "$TITLE" ] && [ "$TITLE" != "null" ]; then
                  TRACK_NAME="$TITLE"
                  LANG_CODE="und"
                else
                  TRACK_NAME="Audio_$((i+1))"
                  LANG_CODE="und"
                fi
              else
                TRACK_NAME="${LANG^}"
                LANG_CODE="$LANG"
              fi

              DEFAULT_ATTR=$([ $i -eq 0 ] && echo "YES" || echo "NO")
              AUDIO_FILENAME="audio_${i}.m3u8"

              ffmpeg -i ../source_input.mp4 -map 0:a:$i -c:a aac -b:a 128k -ar 44100 -vn \
                -copyts -avoid_negative_ts make_zero \
                -hls_time 6 -hls_list_size 0 \
                -hls_segment_filename "audio_${i}_%03d.ts" \
                "$AUDIO_FILENAME"

              echo "#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID=\"audio_group\",NAME=\"$TRACK_NAME\",DEFAULT=$DEFAULT_ATTR,AUTOSELECT=YES,LANGUAGE=\"$LANG_CODE\",URI=\"$AUDIO_FILENAME\"" >> master.m3u8
            done

            echo "#EXT-X-STREAM-INF:BANDWIDTH=2500000,RESOLUTION=1920x1080,AUDIO=\"audio_group\"" >> master.m3u8
            echo "stream_video.m3u8" >> master.m3u8
          fi

      - name: Upload HLS to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          echo "Uploading generated HLS chunks directly to Cloudflare R2..."
          aws s3 sync output/ s3://anizone/${{ inputs.target_folder }}/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --cache-control "public, max-age=31536000"
